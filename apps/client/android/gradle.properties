org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP built-in Kotlin compiles all Kotlin sources without applying KGP.
# Explicit values also stop the Flutter migrator from re-adding disabling flags.
# android.newDsl must stay false until Flutter's Gradle plugin supports the
# AGP 9 new DSL (it still casts the android extension to the old type).
android.builtInKotlin=true
android.newDsl=false
